condition: C
dataset: biwi
output_dir: scaffoldswap/outputs/biwi/condC_v2
cache_dir: pretrained_models

data:
  data_dir: scaffoldswap/data/biwi/processed
  pca_dim: 512
  audio_rate: 16000
  target_fps: 25
  vertex_scaling: 0.2

model:
  frontend: phoneme
  n_phonemes: 67
  embed_dim: 256
  prosody_dim: 2
  timing_dim: 2
  hidden_dim: 256
  decoder_blocks: 5
  decoder_kernel_size: 3
  pca_output_dim: 512
  num_speakers: 6
  speaker_embed_dim: 64

training:
  optimizer: adam
  lr: 0.0001
  epochs: 300
  batch_size: 8
  eval_every_epochs: 5
  save_best: true
  metric_for_best: val_loss
  scheduler: cosine
  scheduler_eta_min: 0.000001

seeds: [42, 123, 456]
