condition: A
dataset: vocaset
output_dir: scaffoldswap/outputs/vocaset/condA_v2
cache_dir: pretrained_models

data:
  data_dir: scaffoldswap/data/vocaset/processed
  pca_dim: 512
  audio_rate: 16000
  target_fps: 30
  vertex_scaling: 0.5

model:
  frontend: ssl
  ssl_model: microsoft/wavlm-base-plus
  ssl_dim: 768
  prosody_dim: 2
  hidden_dim: 256
  decoder_blocks: 5
  decoder_kernel_size: 3
  pca_output_dim: 512
  num_speakers: 12
  speaker_embed_dim: 64

training:
  optimizer: adam
  lr: 0.0001
  epochs: 300
  batch_size: 8
  eval_every_epochs: 5
  save_best: true
  metric_for_best: val_loss
  scheduler: cosine
  scheduler_eta_min: 0.000001

seeds: [42, 123, 456]
