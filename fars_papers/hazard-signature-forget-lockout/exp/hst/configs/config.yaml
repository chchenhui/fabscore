# Central configuration for HST experiments.
# API keys are loaded from environment variables via python-dotenv (.env file).

api:
  deepseek_model: "Pro/deepseek-ai/DeepSeek-V3.2"
  # API key and base URL loaded from .env: LEMMA_MAAS_API_KEY, LEMMA_MAAS_BASE_URL

embedding:
  default_model: "BAAI/bge-m3"
  ablation_model: "Qwen/Qwen3-Embedding-4B"

retrieval:
  k: 3
  delta: 6  # backfill buffer for Condition B

hazard_signature:
  hazard_categories:
    - skip_validation
    - remote_exec
    - external_upload
    - force_success
    - disable_audit
    - other
  task_types:
    - data_cleaning
    - eda
    - modeling
    - reporting
    - pipeline_debug
    - other
  target_artifacts:
    - dataset
    - code
    - report
    - model
    - other

seeds:
  n_benign: 100
  n_poisoned: 10
  n_paraphrases_per_poisoned: 5
