# Model configuration for the LogRules poisoning experiment.
# induction_model: used via OpenAI API for rule generation
# deduction models: served locally via vLLM for log parsing

induction_model: gpt-4o-mini

primary_deduction_model: Qwen/Qwen2.5-7B-Instruct
secondary_deduction_model: meta-llama/Meta-Llama-3-8B-Instruct

datasets:
  - BGL
  - Linux
  - HDFS

seeds: [42, 123, 456]

conditions:
  - C0_clean
  - C1_poisoned
  - C2_poisoned_defense
